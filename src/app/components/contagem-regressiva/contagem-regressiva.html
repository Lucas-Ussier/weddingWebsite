<div class="countdown-container">
  <h2>O grande dia está chegando!</h2>

  <div class="timer-grid">
    <div class="tempo-box">
      <span class="numero">{{ tempo.meses }}</span>
      <span class="label">Meses</span>
    </div>
    <div class="tempo-box">
      <span class="numero">{{ tempo.dias }}</span>
      <span class="label">Dias</span>
    </div>
    <div class="tempo-box">
      <span class="numero">{{ tempo.horas }}</span>
      <span class="label">Horas</span>
    </div>
    <div class="tempo-box">
      <span class="numero">{{ tempo.minutos }}</span>
      <span class="label">Min</span>
    </div>
    <div class="tempo-box">
      <span class="numero">{{ tempo.segundos }}</span>
      <span class="label">Seg</span>
    </div>
  </div>
</div>
